name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  backend:
    name: Backend - Lint, Format, Typecheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: knik
          # Throwaway CI database: trust auth means no password to commit.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: knik_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knik"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install system dependencies
        run: sudo apt-get install -y libportaudio2

      - name: Create venv and install dependencies
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install -r requirements.txt -c .github/constraints-ci.txt --only-binary tokenizers

      - name: Ruff lint
        run: |
          source .venv/bin/activate
          ruff check .

      - name: Ruff format check
        run: |
          source .venv/bin/activate
          ruff format --check .

      - name: Pyright
        run: |
          source .venv/bin/activate
          pyright

      - name: Import contracts
        run: |
          source .venv/bin/activate
          cd src && lint-imports --config ../pyproject.toml

      - name: No sys.path hacks in src
        run: |
          ! grep -rn "sys.path.insert" src --include='*.py'

      - name: Migrations apply and re-apply cleanly
        env:
          KNIK_DB_HOST: localhost
          KNIK_DB_PORT: "5432"
          KNIK_DB_USER: knik
          KNIK_DB_NAME: knik_migrate
        run: |
          psql -h localhost -U knik -d knik_test -c "CREATE DATABASE knik_migrate"
          scripts/migrate.sh
          # Like an install that predates schema_migrations: every file runs again over the migrated schema.
          psql -h localhost -U knik -d knik_migrate -c "DROP TABLE schema_migrations"
          scripts/migrate.sh
          scripts/migrate.sh | tee third-run.log
          grep -q "Done: 0 applied" third-run.log

      - name: Run tests
        env:
          KNIK_TEST_DATABASE_URL: postgresql://knik@localhost:5432/knik_test
        run: |
          source .venv/bin/activate
          pytest -v

  frontend:
    name: Frontend - Lint, Format, Typecheck & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        working-directory: src/apps/web/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: ESLint
        run: npx eslint .

      - name: Prettier format check
        run: npx prettier --check "src/**/*.{ts,tsx,css,json}"

      - name: TypeScript type-check
        run: npx tsc -b --noEmit

      - name: Build
        run: npx vite build
